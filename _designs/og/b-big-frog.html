<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>og b-big-frog</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap">
  <link rel="stylesheet" href="/assets/pond.css">
  <link rel="stylesheet" href="og.css">
  <script>try { localStorage.setItem('frog-bg', 'paper-lilypad'); } catch (e) {}</script>
  <style>
.og .avatar { position: absolute; left: 90px; top: 95px; width: 440px; height: 440px; border-width: 3px; box-shadow: 14px 14px 0 var(--ink); }
.og .avatar svg { width: 300px; }
.b-name { position: absolute; left: 600px; top: 150px; }
.b-name h1 { display: inline-block; margin: 0; background: var(--ink); color: var(--paper); font-size: 76px; line-height: 1; letter-spacing: -.04em; padding: 18px 24px 22px; }
.b-name .sheet-og { position: relative; display: block; margin-top: 26px; padding: 22px 26px; width: 520px; box-shadow: 8px 8px 0 var(--ink); }
.b-name .tagline { font-size: 24px; }
.b-name .url { display: block; margin-top: 26px; }
</style>
</head>
<body>
  <div class="og">
    <div class="avatar"></div>
    <div class="b-name">
      <h1>frogscooper</h1>
      <div class="sheet-og"><p class="tagline">CS sophomore @ OSU. I build software with 3 priorities: efficiency, precision, and aura.</p><span class="url">frogscooper.dev</span></div>
    </div>
  </div>
  <script src="/frog-backdrop.js"></script>
  <script src="/assets/pond.js"></script>
</body>
</html>

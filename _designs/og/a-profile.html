<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>og a-profile</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap">
  <link rel="stylesheet" href="/assets/pond.css">
  <link rel="stylesheet" href="og.css">
  <script>try { localStorage.setItem('frog-bg', 'swiss-contour'); } catch (e) {}</script>
  <style>
.sheet-og { left: 70px; top: 90px; width: 1060px; height: 450px; }
.a-in { position: absolute; left: 230px; top: 64px; right: 60px; }
.og .avatar { position: absolute; left: 50px; top: -40px; width: 150px; height: 150px; border-width: 2px; box-shadow: 7px 7px 0 var(--ink); }
.og .avatar svg { width: 96px; }
h1 { margin: 0; font-size: 84px; line-height: 1; letter-spacing: -.045em; }
.tagline { margin-top: 18px; max-width: 760px; }
.a-foot { position: absolute; left: 50px; right: 50px; bottom: 40px; display: flex; align-items: center; justify-content: space-between; border-top: 2px solid var(--ink); padding-top: 26px; }
</style>
</head>
<body>
  <div class="og">
    <div class="sheet-og">
      <div class="avatar"></div>
      <div class="a-in"><h1>frogscooper</h1><p class="tagline">CS sophomore @ OSU. I build software with 3 priorities: efficiency, precision, and aura.</p></div>
      <div class="a-foot"><span class="chip">looking for: SWE internship</span><span class="url">frogscooper.dev</span></div>
    </div>
  </div>
  <script src="/frog-backdrop.js"></script>
  <script src="/assets/pond.js"></script>
</body>
</html>

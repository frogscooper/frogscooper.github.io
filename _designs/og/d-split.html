<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>og d-split</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap">
  <link rel="stylesheet" href="/assets/pond.css">
  <link rel="stylesheet" href="og.css">
  <script>try { localStorage.setItem('frog-bg', 'paper-lilypad'); } catch (e) {}</script>
  <style>
.sheet-og { left: 0; top: 0; bottom: 0; width: 640px; border-width: 0 2px 0 0; box-shadow: 10px 0 0 var(--ink); padding: 84px 64px 70px; box-sizing: border-box; display: flex; flex-direction: column; }
.k { display: block; margin-bottom: 18px; }
h1 { margin: 0; font-size: 80px; line-height: 1; letter-spacing: -.045em; }
.tagline { margin-top: 22px; }
.d-foot { margin-top: auto; display: flex; align-items: center; justify-content: space-between; }
.chip { font-size: 19px; padding: 10px 13px; white-space: nowrap; }
.d-foot { gap: 24px; }
.url { font-size: 20px; }
.og .avatar { position: absolute; left: 815px; top: 175px; width: 260px; height: 260px; border-width: 3px; box-shadow: 10px 10px 0 var(--ink); }
.og .avatar svg { width: 172px; }
</style>
</head>
<body>
  <div class="og">
    <div class="sheet-og">
      <h1>frogscooper</h1>
      <p class="tagline">CS sophomore @ OSU. I build software with 3 priorities: efficiency, precision, and aura.</p>
      <div class="d-foot"><span class="chip">looking for: SWE internship</span><span class="url">frogscooper.dev</span></div>
    </div>
    <div class="avatar"></div>
  </div>
  <script src="/frog-backdrop.js"></script>
  <script src="/assets/pond.js"></script>
</body>
</html>

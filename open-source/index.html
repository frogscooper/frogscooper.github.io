  <style>
    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      background: transparent; /* frog-backdrop.js paints the page behind the content */
      color: #101010;
      font: 15px/1.5 Arial, Helvetica, sans-serif;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
      text-underline-offset: 4px;
    }

    h1,
    h2,
    p {
      margin-top: 0;
    }

    :root {
      --bg: #fafaf8;
      --ink: #101010;
      --muted: #686868;
      --line: #d3d3cf;
    }

    .shell {
      width: min(1210px, calc(100% - 54px));
      margin: auto;
    }

    .site-header,
    .intro,
    .section,
    footer {
      display: grid;
      grid-template-columns: 190px 1fr;
      gap: 44px;
    }

    .site-header {
      padding: 27px 0 94px;
      border-bottom: 1px solid var(--ink);
    }

    .identity {
      display: flex;
      flex-direction: column;
    }

    .identity strong {
      font-size: 15px;
    }

    .identity span {
      font-size: 12px;
      color: var(--muted);
    }

    nav {
      display: flex;
      justify-content: flex-end;
      flex-wrap: wrap;
      align-items: center;
      row-gap: 8px;
      gap: 20px;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.045em;
    }

    .intro {
      padding: 23px 0 76px;
    }

    .eyebrow,
    .section h2 {
      font: 700 11px/1 Arial;
      text-transform: uppercase;
      letter-spacing: 0.09em;
    }

    .intro h1 {
      max-width: 760px;
      margin-bottom: 14px;
      font-size: 34px;
      line-height: 1.06;
      letter-spacing: -0.045em;
      font-weight: 700;
    }

    .intro p {
      max-width: 680px;
      margin-bottom: 0;
      color: #4b4b4b;
      font-size: 17px;
    }

    .section {
      padding: 12px 0 58px;
      border-top: 1px solid var(--ink);
    }

    .section h2 {
      margin-bottom: 0;
    }

    .section-main {
      min-width: 0;
      max-width: 780px;
    }

    footer {
      display: grid;

    }

    .section h2 {

    }

    .section-main {
      min-width: 0;
      max-width: 780px;
    }

    .contact-list {
      border-top: 1px solid var(--line);
    }

    .contact-row {
      display: grid;
      grid-template-columns: 130px 1fr auto;
      gap: 24px;
      align-items: baseline;
      padding: 18px 0;
      border-bottom: 1px solid var(--line);
    }

    .contact-label {
      color: var(--muted);
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }

    .contact-value {
      min-width: 0;
      overflow-wrap: anywhere;
    }

    .contact-note {
      color: var(--muted);
      font-size: 12px;
      text-align: right;
    }

    .details {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 34px;
    }

    .detail-block h3 {
      margin: 0 0 8px;
      font-size: 13px;
    }

    .detail-block p {
      margin-bottom: 0;
      color: #4b4b4b;
    }

    .small-note {
      margin-top: 22px;
      color: var(--muted);
      font-size: 12px;
    }

    footer {
      padding: 12px 0 32px;
      border-top: 1px solid var(--ink);
      color: var(--muted);
      font-size: 12px;
    }

    footer div {
      display: flex;
      gap: 20px;
    }

    @media (max-width: 760px) {
      .site-header,
      .intro,
      .section,
      footer {
        grid-template-columns: 1fr;
      }

      .site-header {
        gap: 18px;
        padding-bottom: 56px;
      }

      nav {
        justify-content: flex-start;
        flex-wrap: wrap;
      }

      .intro h1 {
        font-size: 29px;
      }
    }

    /* Terminal type: JetBrains Mono everywhere. Monospace runs wide, so sizes come down a step. */
    :root {
      --mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Consolas, monospace;
    }

    body {
      font-family: var(--mono);
      font-size: 14px;
      line-height: 1.6;
      font-variant-ligatures: none;
    }

    .eyebrow,
    .section h2,
    .section-head h2,
    .about h2 {
      font-family: var(--mono);
    }

    .identity strong {
      font-weight: 700;
      letter-spacing: -0.01em;
    }

    .intro p {
      font-size: 15.5px;
    }

    .intro h1 {
      font-size: 30px;
      letter-spacing: -0.03em;
    }

    .heading h3 {
      font-size: 26px;
      letter-spacing: -0.03em;
    }

    .secondary .heading h3 {
      font-size: 21px;
    }

    nav,
    .links {
      letter-spacing: 0.02em;
    }

    /* The backdrop switch sits at the top of the left column, above the name. */
    .brand {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 14px;
    }

    .site-header nav {
      align-self: start;
      min-height: 26px; /* lines the links up with the switch */
    }

    .brand [data-frog-toggle] {
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.02em;
    }

    /* PR list: same terminal frame and rows as the home page Open source section. */
    .frame {
      position: relative;
      margin: 0;
      padding: 0 8px 8px;
      border: 2px solid var(--ink);
      background: #f6f7f2;
      box-shadow: 8px 8px 0 var(--ink);
    }
    .frame::before {
      content: "";
      position: absolute;
      inset: -14px;
      pointer-events: none;
      background:
        linear-gradient(var(--ink),var(--ink)) top left / 14px 1px,
        linear-gradient(var(--ink),var(--ink)) top left / 1px 14px,
        linear-gradient(var(--ink),var(--ink)) top right / 14px 1px,
        linear-gradient(var(--ink),var(--ink)) top right / 1px 14px,
        linear-gradient(var(--ink),var(--ink)) bottom left / 14px 1px,
        linear-gradient(var(--ink),var(--ink)) bottom left / 1px 14px,
        linear-gradient(var(--ink),var(--ink)) bottom right / 14px 1px,
        linear-gradient(var(--ink),var(--ink)) bottom right / 1px 14px;
      background-repeat: no-repeat;
    }
    .fig-head {
      display: grid;
      grid-template-columns: auto 1fr auto;
      align-items: center;
      gap: 12px;
      margin: 0 -8px 8px;
      padding: 7px 10px;
      border-bottom: 2px solid var(--ink);
      background: repeating-linear-gradient(0deg, transparent 0 3px, rgba(16,16,16,0.08) 3px 4px), #e4e9de;
      font-size: 10px;
      letter-spacing: 0.06em;
    }
    .fig-head span:nth-child(2) { text-align: center; }
    .fig-head span:last-child { color: var(--muted); }
    .dots { display: flex; gap: 5px; }
    .dots i { width: 9px; height: 9px; border: 1.5px solid var(--ink); }
    .dots i:first-child { background: var(--ink); }
    .frame figcaption {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      padding: 8px 2px 0;
      font-size: 10px;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--muted);
    }
    .pr-list { list-style: none; margin: 0; padding: 4px 14px; font: 12px/1.5 var(--mono); }
    .pr {
      display: grid; grid-template-columns: minmax(0, 15ch) 6ch minmax(0, 1fr) auto 11ch;
      gap: 6px 18px; align-items: baseline; padding: 10px 0; border-bottom: 1px dashed var(--line);
    }
    .pr:last-child { border-bottom: 0; }
    .pr-repo { color: var(--muted); overflow-wrap: anywhere; }
    .pr-num { color: var(--muted); }
    .pr-title { color: var(--ink); overflow-wrap: anywhere; }
    .pr-tag { padding: 1px 7px; border: 1px solid var(--ink); font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase; }
    .pr-tag.merged { background: var(--ink); color: var(--bg); }
    .pr-tag.closed { border-style: dashed; color: var(--muted); }
    .pr-date { color: var(--muted); text-align: right; white-space: nowrap; }
    @media (max-width: 760px) {
      .frame { box-shadow: 5px 5px 0 var(--ink); }
      .frame::before { inset: -10px; }
      .fig-head span:last-child,
      .frame figcaption span:last-child { display: none; }
      .fig-head { grid-template-columns: auto 1fr; }
      .fig-head span:nth-child(2) { text-align: left; }
      .pr-list { padding: 2px 6px; }
      .pr { grid-template-columns: minmax(0, 1fr) auto; }
      .pr-num { grid-row: 1; grid-column: 2; text-align: right; }
      .pr-title { grid-column: 1 / -1; grid-row: 2; }
      .pr-tag { grid-row: 3; justify-self: start; }
      .pr-date { grid-row: 3; }
    }

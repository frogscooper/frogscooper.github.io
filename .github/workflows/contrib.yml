name: Refresh contribution heatmap

# Pulls the public contribution calendar for frogscooper and rewrites assets/contrib.json
# (read by assets/contrib.js). Only commits when the numbers actually changed.
on:
  schedule:
    - cron: '23 */4 * * *'   # every 4 hours, at :23 to stay off the top-of-hour rush
  workflow_dispatch:         # Actions tab > Run workflow, for a manual refresh

permissions:
  contents: write

concurrency:
  group: contrib
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch contribution calendar
        run: |
          curl -fsSL --retry 3 --retry-delay 5 \
            -H 'User-Agent: frogscooper-pages-contrib' \
            'https://github.com/users/frogscooper/contributions' -o "$RUNNER_TEMP/contrib.html"
          python3 scripts/contrib.py "$RUNNER_TEMP/contrib.html" assets/contrib.json

      - name: Commit if changed
        run: |
          if git diff --quiet -- assets/contrib.json; then
            echo "no change"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/contrib.json
          git commit -m "Refresh contribution data"
          git push
